# The visitor's address, behind Cloudflare.
#
# Every request reaches Nginx from a Cloudflare edge, so without this
# $remote_addr — the access log, and the X-Real-IP header passed upstream — is
# Cloudflare's address, not the visitor's. Cloudflare puts the visitor's in
# CF-Connecting-IP; Nginx takes it from there, but only when the connection
# comes from one of Cloudflare's ranges, so nobody else can set it.
#
# Included in each server block of beyondthearc.conf, not at http level: the
# other site on this Nginx is not part of this repository.
#
# The ranges are https://www.cloudflare.com/ips/ as of 2026-11-18 — the same
# list as the Hetzner firewall's 80/443 rules. Update both together.

real_ip_header CF-Connecting-IP;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
