# Nginx site for beyondthearc.app and grafana.beyondthearc.app.
#
# Nginx runs on the VPS host, not in Compose. This file is what it serves:
# /etc/nginx/sites-enabled/beyondthearc is a symlink to the deploy clone's copy
# (/opt/beyondthearc/docker/nginx/beyondthearc.conf), and docker/deploy.sh runs
# `nginx -t` then reloads Nginx when a deploy changes it. Edit it here, never
# on the server: the next deploy resets the clone to the deployed commit.
#
# Every hostname is proxied by Cloudflare (SSL mode Full (strict)), and the
# Hetzner firewall admits 80/443 from Cloudflare's ranges only; see
# docs/infrastructure.md.

# Each request of the main site with how long it took, one JSON object per line, beside
# the usual access.log: request_time from the first byte read from Cloudflare to the
# last byte sent back, upstream_response_time the part spent waiting on the container.
# The latter is the server-side time the phase 5 latency gate compares against
# Traefik's OriginDuration on the k3s host (infra/k8s/ASSESSMENT.md). This file sits in
# nginx.conf's http block, so the format is declared here; logrotate's nginx entry
# rotates it with the other /var/log/nginx/*.log files.
log_format beyondthearc_timing escape=json
    '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"client":"$remote_addr","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name beyondthearc.app www.beyondthearc.app grafana.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beyondthearc.app www.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/beyondthearc.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondthearc.app/privkey.pem;

    # An access_log here replaces the one inherited from the http block, so access.log
    # is named again to keep receiving this server's requests.
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/beyondthearc-timing.log beyondthearc_timing;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://a.tile.openstreetmap.org; connect-src 'self' https://a.tile.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name grafana.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/beyondthearc.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondthearc.app/privkey.pem;

    # Only the two headers Grafana does not send itself. It already sends
    # X-Content-Type-Options: nosniff and X-Frame-Options: deny, and a second
    # copy from here would duplicate them; its session cookie and XSS header are
    # set through GF_SECURITY_* in docker-compose.prod.yml.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
