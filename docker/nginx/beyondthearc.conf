# Nginx site for beyondthearc.app and grafana.beyondthearc.app.
#
# Nginx runs on the VPS host, not in Compose. This file is what it serves:
# /etc/nginx/sites-enabled/beyondthearc is a symlink to the deploy clone's copy
# (/opt/beyondthearc/docker/nginx/beyondthearc.conf), and docker/deploy.sh runs
# `nginx -t` then reloads Nginx when a deploy changes it. Edit it here, never
# on the server: the next deploy resets the clone to the deployed commit.
#
# Every hostname is proxied by Cloudflare (SSL mode Full (strict)), and the
# Hetzner firewall admits 80/443 from Cloudflare's ranges only; see
# docs/infrastructure.md.

server {
    listen 80;
    server_name beyondthearc.app www.beyondthearc.app grafana.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name beyondthearc.app www.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/beyondthearc.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondthearc.app/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://a.tile.openstreetmap.org; connect-src 'self' https://a.tile.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name grafana.beyondthearc.app;
    include /opt/beyondthearc/docker/nginx/cloudflare-realip.conf;

    ssl_certificate     /etc/letsencrypt/live/beyondthearc.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondthearc.app/privkey.pem;

    location / {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
