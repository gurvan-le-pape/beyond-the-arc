# REGISTRY_IMAGE is the registry path without a tag, set in .env on the VPS
# (ghcr.io/<owner>/beyond-the-arc). Each *_DIGEST is the digest of the image CI
# started and pushed; with one, Docker pulls that digest and the tag is only a label.
# Without (a deploy by hand that names a commit only), the tag decides. Kept out of this file so the
# same overlay works for any registry, and so moving hosts is an .env change.
services:
  frontend:
    image: ${REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}${FRONTEND_DIGEST:+@${FRONTEND_DIGEST}}
    build: !reset null
    environment:
      - NODE_ENV=production
    # Prod only. Every other long-running service carries this in the base
    # file, but the two application containers defaulted to `no`, so a VPS
    # reboot brought Postgres, the scheduler and the whole observability stack
    # back while the site itself stayed down until someone ran `up -d` by hand.
    # Kept out of the base file because dev wants the opposite: a dev server
    # that crashes should stay down and be read, not be respawned in a loop.
    restart: unless-stopped

  backend:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}
    build: !reset null
    environment:
      - NODE_ENV=production
    # See the frontend service. `unless-stopped` rather than `always` so a
    # deliberate `compose stop` during an incident is not undone by a reboot.
    restart: unless-stopped

  migrate:
    image: ${REGISTRY_IMAGE}/backend-migrate:${IMAGE_TAG:-latest}${BACKEND_MIGRATE_DIGEST:+@${BACKEND_MIGRATE_DIGEST}}
    build: !reset null

  # Pinned to the deploy's tag like the other three. Before this the service
  # had a `build:` and no `image:` anywhere, so it was never pushed and never
  # pulled: `up -d` builds only when an image is absent, so the VPS kept the
  # one it happened to build once and no deploy replaced it. That also left it
  # the one service with no tag to roll back to.
  scheduler:
    image: ${REGISTRY_IMAGE}/scheduler:${IMAGE_TAG:-latest}${SCHEDULER_DIGEST:+@${SCHEDULER_DIGEST}}
    build: !reset null

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      # Production only: Grafana is served over HTTPS here, and a Secure session
      # cookie would break the login over plain HTTP locally.
      - GF_SECURITY_COOKIE_SECURE=true
      # The legacy XSS filter is off on the main site too (X-XSS-Protection: 0);
      # Grafana sends "1; mode=block" unless told not to.
      - GF_SECURITY_X_XSS_PROTECTION=false

volumes:
  postgres_data:
    external: true
