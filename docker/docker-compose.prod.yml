# REGISTRY_IMAGE is the registry path without a tag, set in .env on the VPS
# (registry.gitlab.com/<namespace>/beyond-the-arc). Kept out of this file so the
# same overlay works for any registry, and so moving hosts is an .env change.
services:
  frontend:
    image: ${REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      - NODE_ENV=production

  backend:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      - NODE_ENV=production

  migrate:
    image: ${REGISTRY_IMAGE}/backend-migrate:${IMAGE_TAG:-latest}
    build: !reset null

  # Pinned to the deploy's tag like the other three. Before this the service
  # had a `build:` and no `image:` anywhere, so it was never pushed and never
  # pulled: `up -d` builds only when an image is absent, so the VPS kept the
  # one it happened to build once and no deploy replaced it. That also left it
  # the one service with no tag to roll back to.
  scheduler:
    image: ${REGISTRY_IMAGE}/scheduler:${IMAGE_TAG:-latest}
    build: !reset null

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}

volumes:
  postgres_data:
    external: true
