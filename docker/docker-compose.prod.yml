services:
  frontend:
    image: ghcr.io/gurvan-le-pape/beyond-the-arc/frontend:latest
    build: !reset null
    environment:
      - NODE_ENV=production

  backend:
    image: ghcr.io/gurvan-le-pape/beyond-the-arc/backend:latest
    build: !reset null
    environment:
      - NODE_ENV=production

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}

volumes:
  postgres_data:
    external: true
