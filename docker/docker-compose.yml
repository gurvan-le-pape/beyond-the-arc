# Every service's stdout/stderr, capped. Docker's default `json-file` driver
# keeps one file per container with no size limit, under
# /var/lib/docker/containers — on the root disk, not on the volume that holds
# /var/lib/docker/volumes. A file only goes away with its container, so a
# service the deploy never recreates (Loki, Prometheus, Grafana…) grows for as
# long as it runs. `local` rotates and compresses; 5 × 20 MB per service.
# Nothing reads these files directly: Promtail tails through the Docker API,
# which `local` supports, and Loki holds the 31-day history.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"

services:
  frontend:
    logging: *logging
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
      args:
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - FRONTEND_URL=${FRONTEND_URL}
    # Loopback only. Nothing off-host consumes a published port: Nginx runs on
    # the VPS itself and proxies to localhost, and every container-to-container
    # call goes over my_network by service name. Publishing on 0.0.0.0 put the
    # Postgres superuser port and an unauthenticated Prometheus one console rule
    # away from the internet — Docker's published-port iptables rules sit in
    # front of host firewalls, so that rule was the *only* control, it lives
    # outside this repository, and the origin IP is in public DNS history.
    #
    # Both loopback addresses, not just 127.0.0.1: /etc/hosts on the VPS maps
    # `localhost` to 127.0.0.1 *and* ::1, and the Nginx config proxies to
    # `localhost` — an IPv4-only bind leaves half of that resolution dead.
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    # `service_healthy`, not the bare list form. Waiting only for the backend
    # *container* to start is not waiting for anything useful: Nest and Prisma
    # take seconds to come up after the process does, so `up -d` produced a
    # window on every deploy where the frontend served requests that no backend
    # could answer. That window used to be cosmetic — the pages 500'd and the
    # client recovered. It stopped being cosmetic when those pages started
    # answering 200: a 200 is written to the ISR cache, so one request landing
    # in the window pins an error card on a `revalidate = 3600` route for the
    # next hour, against a cache that a container recreate has just emptied.
    # Measured: `x-nextjs-cache: HIT` still serving the error card long after
    # the backend was healthy again. See shared/components/feedback/
    # withServerErrorState.tsx.
    #
    # The trade-off, accepted: a backend that never reports healthy now keeps
    # the frontend from starting at all, where before it would have come up and
    # rendered error cards. The deploy already fails in that case — its own
    # health gate covers both services — so the failure mode changes from
    # "deploy fails with a degraded site" to "deploy fails", and the rollback
    # is the same one either way.
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_API_URL=${INTERNAL_API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    # Requests a page rather than checking the port, because "listening but
    # every render 500s" is the frontend failure this is for and a TCP probe
    # cannot see it. `/` is a 307 to `/en` from the next-intl middleware;
    # wget follows it, so this exercises a real render.
    #
    # `127.0.0.1`, never `localhost`. The Dockerfile sets `HOSTNAME=0.0.0.0`,
    # so Next's standalone server binds **IPv4 only** — `/proc/net/tcp6` in the
    # prod image is empty — while Alpine's /etc/hosts maps `localhost` to
    # 127.0.0.1 *and* ::1. BusyBox wget tries ::1 and gets ECONNREFUSED. This
    # is the same half-dead resolution the port comments above describe for
    # Nginx, one layer in: it passed in dev (where `next dev` binds dual-stack)
    # and failed on the first production deploy.
    #
    # That render calls the backend over my_network, so a backend outage marks
    # the frontend unhealthy too. That coupling is deliberate: the page really
    # is broken then, and nothing acts on the status automatically (see the
    # backend service below).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - my_network

  backend:
    logging: *logging
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    # Loopback only — see the frontend service. /metrics also lives on this
    # port, outside the /api prefix Nginx proxies, so it must not be reachable
    # from anywhere but the host.
    ports:
      - "127.0.0.1:4000:4000"
      - "[::1]:4000:4000"
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      # Names the build an event came from. IMAGE_TAG is the deploy's commit
      # SHA, written into the VPS .env by the deploy job, and it is also what
      # selects the image in docker-compose.prod.yml — so a release always
      # names an image that exists, and an IMAGE_TAG rollback re-tags with it.
      # Locally there is no image tag, hence the `dev` fallback.
      - SENTRY_RELEASE=${IMAGE_TAG:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # What finally calls /api/health. The endpoint has run the database ping,
    # the 300 MB heap check and the 90 % disk check since it was written, and
    # nothing invoked it: Prometheus scrapes only /metrics, every alert rule is
    # a Prometheus expression, and the sole caller under /health was one
    # post-deploy curl in ci.yml. The checks were dead code that read as a
    # control in place — the exact conditions of the 2026-07 disk incident.
    #
    # `--spider` sends HEAD; Express answers it from the same GET handler, so
    # the indicators still run and only the body is discarded.
    #
    # `127.0.0.1` for the same reason the frontend uses it, though this one
    # would work either way: Nest's `app.listen(port)` binds `::` dual-stack,
    # so ::1 resolves here. Written explicitly so the two probes match and
    # neither depends on a bind default that is not stated anywhere. A 503 from a
    # failing indicator is a non-zero exit, which is what marks it unhealthy.
    #
    # **This does not restart anything.** Measured, not assumed: a container
    # held unhealthy for 20 s under `restart: unless-stopped` showed
    # RestartCount 0 and an unchanged StartedAt. Docker's restart policy fires
    # on process *exit*, not on health status; auto-restart on unhealthy needs
    # Swarm or an autoheal sidecar, neither of which is here. What this buys is
    # that the checks execute on a schedule and their verdict is visible in
    # `docker compose ps` — nothing pages anyone. See docs/observability.md.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - my_network

  # One-shot: applies pending Prisma migrations, then exits. backend and
  # scheduler only start after it succeeds, so they never run against a
  # database whose schema is behind the code.
  migrate:
    logging: *logging
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - my_network

  database:
    logging: *logging
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # Loopback only — see the frontend service. `make psql` and every other
    # database target go through `docker compose exec`, so nothing here depends
    # on the published port; it stays published for a host-side psql over SSH.
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Here rather than in the prod overlay, with the other infrastructure
    # services: a database that comes back after a reboot is wanted in dev too,
    # and `backend` waits on `service_healthy`, so a stopped Postgres holds the
    # whole stack down rather than just its own service.
    restart: unless-stopped
    networks:
      - my_network

  scheduler:
    logging: *logging
    build:
      context: ../
      dockerfile: docker/python-script/Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - my_network

  prometheus:
    logging: *logging
    image: prom/prometheus:v3.11.2
    # Loopback only — see the frontend service. Prometheus has no authentication
    # of any kind, and it scrapes over my_network rather than through this port.
    ports:
      - "127.0.0.1:9090:9090"
      - "[::1]:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  loki:
    logging: *logging
    image: grafana/loki:3.7.1
    user: "10001:10001"
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  promtail:
    logging: *logging
    image: grafana/promtail:3.6.8
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - my_network
    depends_on:
      - loki

  grafana:
    logging: *logging
    image: grafana/grafana:13.0.13
    # Loopback only — see the frontend service. Nginx terminates TLS for
    # grafana.beyondthearc.app and proxies here.
    ports:
      - "127.0.0.1:3001:3000"
      - "[::1]:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${GMAIL_ADDRESS}
      - GF_SMTP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GMAIL_ADDRESS}
      # Not a GF_* setting: the alerting provisioning file reads it back with
      # $__env{GMAIL_ADDRESS} to address the notifications.
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      # Go has no knowledge of the cgroup limit below, so without this the
      # runtime grows its heap toward whatever the machine has and the kernel
      # resolves the overshoot by killing the process. Measured on prod before
      # this was set: a flat 171 MB RSS on a 75 MB live heap, but a 141 MB GC
      # goal (GOGC=100) and 412 MB of heap arena reserved *above* a 256M cap —
      # 10 OOM kills in 11 days, every one at anon-rss ~259 MB.
      # Keep it comfortably under `memory` below: this is the ceiling the GC
      # works to, and the container still needs room for non-heap RSS.
      - GOMEMLIMIT=400MiB
    restart: unless-stopped
    networks:
      - my_network
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  node-exporter:
    logging: *logging
    image: prom/node-exporter:v1.11.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped
    networks:
      - my_network

  # Per-container CPU and memory, which nothing else measures: node-exporter
  # sees the host as a whole and the backend reports only its own process. It
  # is what sizes container limits from observed peaks rather than a guess, and
  # its container_oom_events_total is how an OOM kill becomes visible.
  #
  # Trimmed hard, because its defaults cost more than this host should pay:
  # housekeeping every 15s (the default is 1s, scraped every 15s anyway), Docker
  # containers only, the metric groups below switched off, and one label kept —
  # the Compose service name — instead of every container label.
  #
  # Reads the Docker socket through /var/run, like promtail: a read-only bind
  # does not make a socket read-only, so this container can drive the Docker
  # API. No port published; Prometheus scrapes it over my_network.
  cadvisor:
    logging: *logging
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service"
      - "--disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,network,percpu,perf_event,pressure,process,referenced_memory,resctrl,sched,tcp,udp"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - my_network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Availability probing for the services that expose no metrics of their own —
  # the frontend, the database, the scheduler. `up` only ever covered the three
  # scraped targets, so until now a dead frontend produced no series change and
  # no alert: the site was down and every backend metric stayed green.
  #
  # No port published. It is scraped by Prometheus over my_network, like every
  # other exporter here, and it has no authentication.
  blackbox-exporter:
    logging: *logging
    image: prom/blackbox-exporter:v0.28.0
    volumes:
      - ./config/blackbox.yml:/etc/blackboxexporter/config.yml:ro
    command:
      - "--config.file=/etc/blackboxexporter/config.yml"
    restart: unless-stopped
    networks:
      - my_network

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  my_network:
    driver: bridge
