apiVersion: 1
groups:
  - orgId: 1
    name: backend-alerts
    folder: Backend
    interval: 1m
    rules:
      - uid: ffjcvp82ihurkd
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              # Not `== 0`: a comparison in PromQL filters, so a healthy
              # backend returns an empty vector and the rule reads NoData
              # instead of OK. Query the gauge and let the threshold below
              # decide.
              expr: up{job="backend"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # No `up` series at all means Prometheus has lost the target or is
        # itself down — we cannot tell whether the backend is serving, which
        # is the condition this rule exists to report.
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          summary: Backend is unreachable by Prometheus
        isPaused: false
        notification_settings:
          receiver: email-admin
      # Absolute rate, and the title says so. This rule was called "High Error
      # Rate" and annotated "exceeded 1%" while computing no ratio at all —
      # nothing divides by the total request rate. Ruled 2026-08-16 to keep the
      # instrument and fix the label, because at this deployment's volume a
      # percentage is the wrong instrument, not the right one worded badly:
      #
      #   guaranteed traffic is 0.1 req/s, all 200s, and all counted — the
      #   blackbox probe hits /api/health every 15s and the backend's own
      #   compose healthcheck every 30s (1/15 + 1/30). Only /metrics is
      #   excluded from http_requests_total, not /api/health.
      #
      # So 0.01/s ≈ 3 errors per 5 minutes ≈ 10 % of idle traffic — the rule is
      # an order of magnitude *less* trigger-happy than the 1 % it claimed. A
      # true 1 % ratio would fire on a single 5xx in five minutes, since one
      # error in ~30 requests is 3.3 %. The two only coincide at 1 req/s.
      #
      # The trade-off accepted: absolute thresholds do not scale with traffic.
      # If sustained volume ever clears ~1 req/s this wants revisiting as a
      # ratio with a minimum-volume guard.
      - uid: dfjgorz70lfy8c
        title: Backend 5xx Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: rate(http_requests_total{status_code=~"5.."}[5m])
              instant: true
              interval: ""
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.01
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # The 5xx selector matches nothing until a 5xx has been served, so an
        # empty result means "no errors", not "cannot tell".
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary:
            Backend 5xx responses exceeded 0.01/s — about 3 in 5 minutes —
            sustained for 5 minutes. This is an absolute rate, not a percentage.
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: efjgov08tmeioc
        title: High Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # A backend with no traffic in the window has no histogram to take a
        # quantile of. That is not a latency incident.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: P95 latency exceeded 2 seconds
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: afjgozcl1u680c
        title: Memory Pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: process_resident_memory_bytes{job="backend"} / 1024 / 1024
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 400
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # Absent process metrics mean the process is gone, which is Service
        # Down's alert to raise — reporting it twice under two names is how
        # the mailbox stops being read.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Process memory RSS exceeded 400MB
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: efjgqlus12jggd
        title: Disk Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_avail_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # Losing node-exporter means losing disk visibility entirely, and a
        # full disk is what took this host down in 2026-07. Silence is the
        # wrong default here.
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Disk usage exceeded 85%
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: cpusaturated7k2m
        title: CPU Saturated
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              # The Host CPU Usage panel's expression, as a fraction: the
              # panel and the alert cannot disagree about the same number,
              # and the panel's dashed 80 % line is this threshold.
              expr: clamp_min(1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])), 0)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.8
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # Missing node-exporter series are Disk Full's to report (it alerts on
        # NoData); raising it here as well would send two mails for one cause.
        noDataState: OK
        execErrState: Error
        # Long on purpose: a burst of simulation or a deploy's restarts is not
        # the condition. What this catches is the host pinned for good — AI
        # crawlers held it at ~95 % for days in 2026-11 with no rule firing.
        for: 30m
        annotations:
          summary: Host CPU above 80% for 30 minutes
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: bfk1x7prb2s0wa
        title: Endpoint Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              # One rule for every probed target rather than one per service:
              # `probe_success` carries the URL in its `instance` label, so a
              # new target in prometheus.yml is covered the moment it is added
              # and needs no second rule to be remembered.
              #
              # Queried as a gauge, not `== 0`, for the same reason as Service
              # Down: a comparison filters, so a healthy target would return an
              # empty vector and the rule would read NoData instead of OK.
              expr: probe_success
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # No `probe_success` series at all means the exporter itself is gone or
        # Prometheus cannot reach it — in which case nothing is being probed and
        # the availability of every target is unknown, which is the condition
        # this rule exists to report.
        noDataState: Alerting
        execErrState: Error
        # Two minutes, matching Service Down: long enough to ride out a deploy
        # recreating a container, short enough that a real outage is not sat on.
        for: 2m
        annotations:
          summary: "A probed endpoint is not answering: {{ $labels.instance }}"
        isPaused: false
        notification_settings:
          receiver: email-admin
      - uid: dbbackupmissing26h
        title: Database Backup Missing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              # Hours since the last backup reached R2, written by the backup job
              # (infra/ansible/roles/postgres_backup) through node-exporter's
              # textfile collector.
              expr: (time() - max(bta_db_backup_last_success_timestamp_seconds)) / 3600
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 26
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        # 26 hours: one nightly run missed, with two hours' slack for a slow one.
        # No series means no backup has ever succeeded on this host, or the
        # metric is no longer collected: either way there is no proof of a backup.
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: No database backup has reached R2 for more than 26 hours
        isPaused: false
        notification_settings:
          receiver: email-admin
