apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-admin
    receivers:
      - uid: email-admin
        type: email
        settings:
          # Read from the container environment rather than committed: the repo
          # is public. Same address the alerts are sent *from*, so alerting
          # needs one mailbox rather than two.
          addresses: $__env{GMAIL_ADDRESS}
