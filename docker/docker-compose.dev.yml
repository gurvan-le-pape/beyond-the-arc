services:
  frontend:
    build:
      target: dev
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
    volumes:
      - ../src/frontend:/app
      - /app/node_modules

  backend:
    build:
      target: dev
    environment:
      - NODE_ENV=development
    volumes:
      - ../src/backend:/app
      - /app/node_modules
      - /app/dist

volumes:
  postgres_data:
