sonar.projectKey=gurvan-le-pape_beyond-the-arc
sonar.organization=gurvan-le-pape
sonar.projectName=Beyond The Arc

# Sources
sonar.sources=src

# Coverage
sonar.javascript.lcov.reportPaths=src/backend/coverage/lcov.info

# Exclusions
#
# The `.tsx` variants are not decoration. A Sonar pattern has to match the
# whole relative path, so `**/*.test.ts` does not match `index.test.tsx` —
# and `docs/frontend-conventions.md` gives the frontend convention as exactly
# that. Without them the first component test written to the documented
# convention would be indexed as production source.
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/prisma/migrations/1_seed_static_data/**,\
  **/*.generated.ts

# The frontend has no test runner, so every one of its 24k lines counts as
# uncovered and the quality gate's `new_coverage >= 80` condition fails on any
# PR that touches it — which it has, for the whole life of the gate. A check
# that can never be green cannot report a regression in the five conditions
# that do work, so the frontend is excluded from coverage until it has a
# harness to be measured against. That gap is tracked on its own terms; it does
# not also need to be a permanent red light on every pull request.
#
# REMOVE `src/frontend/**` the moment a frontend test runner lands.
#
# The scheduler is the same case in a second language. `sonar.sources=src`
# indexes its 24 `.py` files, `sonar.javascript.lcov.reportPaths` is the only
# coverage report configured, and there is no `sonar.python.coverage.reportPaths`
# because there is no pytest harness to produce one — so all 801 of its
# executable lines land in the denominator as uncovered, 40% of the whole
# project's `lines_to_cover`. Any PR touching a `.py` file therefore fails
# `new_coverage >= 80` on the Python lines alone: measured at 20.0% on #555,
# with every other condition green. Same argument as the frontend above — a
# condition that cannot go green cannot report a regression.
#
# Excluded from *coverage* only, not from analysis: the scheduler's bugs and
# code smells are still worth reporting, and it stays in `sonar.sources`.
#
# REMOVE `src/backend/db/python/**` the moment a Python test harness lands, and
# add `sonar.python.coverage.reportPaths` in the same change.
#
# `**/eslint-rules/**` is a third case and a different argument again: it is
# build tooling, the same category as `**/scripts/**` next to it, and it is
# unit-tested nowhere by design — the custom rules are exercised by `npm run
# lint` over the real tree, which is a stronger check than a spec would be.
# Observed on #478/#479/#480, each failing `new_coverage` 0.0 with every other
# condition green; #480 is the clear one, changing a single backend
# `eslint-rules/*.js` file and nothing else.
#
# `jest.globalSetup.js` is the same category one more time: jest itself refuses
# to instrument the file named in the `globalSetup` config option
# (`@jest/transform`'s `shouldInstrument` returns false for it), so its lines
# can never appear in lcov.info and any PR touching it fails `new_coverage`
# with no test that could ever go green. Excluded from coverage only, not from
# analysis.
#
# Written as a glob rather than `src/backend/eslint-rules/**` on purpose. Both
# applications have an `eslint-rules/` directory, and the frontend's is
# currently masked only by the `src/frontend/**` entry below — so the narrow
# form would quietly re-expose 516 ncloc of frontend rule files to the gate on
# the day a frontend test runner lands and that entry is removed. The category
# is "build tooling", not "one directory".
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/dto/**,\
  **/types/**,\
  **/main.ts,\
  **/instrument.ts,\
  **/scripts/**,\
  **/eslint-rules/**,\
  **/jest.globalSetup.js,\
  src/frontend/**,\
  src/backend/db/python/**

# Duplication exclusions: enum-style constants are mirrored between
# backend and frontend by design (until OpenAPI typegen replaces the
# frontend copies), and DTOs are declarative schema definitions where the
# same filter fields legitimately recur across resources (they're already
# excluded from coverage for the same reason) — copy-paste detection on
# both is all false positives.
sonar.cpd.exclusions=\
  **/constants/**,\
  **/dto/**

# Rule suppressions
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sql