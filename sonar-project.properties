sonar.projectKey=gurvan-le-pape_beyond-the-arc
sonar.organization=gurvan-le-pape
sonar.projectName=Beyond The Arc

# Sources
sonar.sources=src

# Coverage
sonar.javascript.lcov.reportPaths=src/backend/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/db/sql/migrations/04_data/**

sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/dto/**,\
  **/types/**

# Rule suppressions
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sql