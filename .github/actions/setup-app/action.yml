name: Setup app
description: Set up Node.js with npm cache and install dependencies for a given app directory. Caller must check out the repo first — a local composite action can't check itself out.

inputs:
  working-directory:
    description: App directory to install dependencies in (e.g. src/backend or src/frontend)
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        # No `cache: npm`. The runners are persistent, so ~/.npm is already
        # warm on each one; the Actions cache would upload and download the same
        # tarballs over the network on every job to restore what is on disk.

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --prefer-offline
