name: CI

# Every job runs on the self-hosted runners `wsl-1`..`wsl-4` (`runs-on:
# [self-hosted, wsl]`), containers on the developer's machine with the host
# Docker socket mounted; their setup is outside this repository and described
# in docs/ci-cd.md. Nothing here uses GitHub's hosted runners.
#
# The runners are persistent, not ephemeral: their home directory survives
# between jobs, which keeps ~/.npm, the setup-node/setup-python tool cache and
# the Docker layer cache warm — and is why anything secret a job writes goes
# in $RUNNER_TEMP, which the runner empties after every job, never under ~.

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger — lets a deploy be re-run from the Actions UI (or via
  # `gh workflow run ci.yml --ref main`) when a push event fails to fire.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main — the deploy job does a live `docker compose up`
  # + SSH deploy, and cancelling it mid-flight could leave the VPS half-deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # BACKEND
  # ============================================================================
  backend-lint:
    name: Backend – Lint
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      # The eslint config is type-aware, and 11 source files import from
      # prisma/generated — which is gitignored and, since Prisma 7 dropped its
      # postinstall, is not created by `npm ci`. Without this the whole Prisma
      # surface types as `any` here, and rules like no-floating-promises stop
      # firing on exactly the call sites they matter most on. `npm test` and
      # `npm run build` both generate first, so this job was the only gap.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Same gap the frontend had: Prettier is not part of the eslint config,
      # so nothing checked it here and four files had drifted.
      - name: Format
        run: npm run format:check

  backend-test:
    name: Backend – Tests
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage/lcov.info

  backend-build:
    name: Backend – Build
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Build
        run: npm run build

  # ============================================================================
  # FRONTEND
  # ============================================================================
  frontend-lint:
    name: Frontend – Lint
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Lint
        run: npm run lint

      # Prettier is not part of the eslint config, so nothing was checking it in
      # CI and 21 files had drifted by the time this was added.
      - name: Format
        run: npm run format:check

  frontend-typecheck:
    name: Frontend – Typecheck
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Typecheck
        run: npm run typecheck

  frontend-messages:
    name: Frontend – Message parity
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Check message parity
        run: npm run check:messages

  # Unit tests for the pure-TS modules (zone predicates, data transforms).
  # Runs vitest in the node environment; spec files live next to the code as
  # *.spec.ts, which barrelsby already excludes.
  frontend-test:
    name: Frontend – Unit tests
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Run unit tests
        run: npm run test

  frontend-build:
    name: Frontend – Build
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build
        run: npm run build

  # ============================================================================
  # SCHEDULER
  # ============================================================================
  # The Python match simulator, on the same Python minor as the
  # docker/python-script base image, with the dev requirements, which add
  # pytest on top of the image's own pins.
  python-test:
    name: Scheduler – Tests
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/backend/db/python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  # ============================================================================
  # API CONTRACT
  # ============================================================================
  # Regenerates docs/openapi.json from the backend and the frontend's
  # api.generated.ts from that document, then fails if either differs from
  # what is committed — backend DTO changes must ship with regenerated types.
  openapi-drift:
    name: OpenAPI – Drift check
    runs-on: [self-hosted, wsl]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Setup frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build backend
        working-directory: src/backend
        run: npm run build

      - name: Regenerate OpenAPI document
        working-directory: src/backend
        run: node dist/scripts/generate-openapi.js

      - name: Regenerate frontend API types
        working-directory: src/frontend
        run: npm run typegen

      - name: Fail on drift
        run: |
          git diff --exit-code docs/openapi.json src/frontend/shared/types/api.generated.ts || {
            echo "::error::docs/openapi.json or api.generated.ts is stale — from src/backend run 'npm run build && node dist/scripts/generate-openapi.js', then from src/frontend run 'npm run typegen', and commit both files. Neither script takes a path: each derives it from its own location, so the snapshot this check diffs is always the one they write."
            exit 1
          }

  # ============================================================================
  # BARRELS
  # ============================================================================
  # The root project is installed by nothing else in CI — every `npm ci` goes
  # through setup-app with src/backend or src/frontend — so barrelsby.json and
  # the 88 barrels it generates were verified nowhere.
  #
  # Two halves, because they catch different things. Regenerating and diffing
  # catches a barrel whose *content* has gone stale. It does NOT catch a defect
  # in the config: an unrecognised key and a directory with no barrel both emit
  # byte-identical output, which is exactly how three of them survived. The
  # script covers that half.
  barrels-drift:
    name: Barrels – Config and drift check
    runs-on: [self-hosted, wsl]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup root
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      # barrels:lint runs eslint --fix over the generated barrels of both
      # applications, each of which needs its own config and plugins installed.
      - name: Setup frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Setup backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Validate barrelsby.json
        run: node scripts/check-barrels-config.mjs

      - name: Regenerate barrels
        run: npm run barrels

      # `git add -A` first: a directory newly added to barrelsby.json produces a
      # barrel that does not exist in the commit yet, and `git diff` alone does
      # not see untracked files — so the most likely drift of all (add a
      # directory, forget to regenerate) would pass silently.
      - name: Fail on drift
        run: |
          git add -A
          git diff --cached --exit-code || {
            echo "::error::Generated barrels are stale. Run 'make barrels' (or 'npm run barrels') and commit the result."
            exit 1
          }

  # ============================================================================
  # MIGRATIONS
  # ============================================================================
  # `prisma migrate deploy` does not checksum migrations it has already applied
  # — it branches on the pending count alone, so an edited migration file is
  # silently ignored on every database that already ran it, while a fresh one
  # gets the new content. Nothing reports the divergence. This job is the only
  # mechanical enforcement of CLAUDE.md's "Never edit an applied migration".
  #
  # Pull requests only: on a push to main there is nothing left to gate.
  migration-immutability:
    name: Migrations – No edits to applied migrations
    runs-on: [self-hosted, wsl]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must be present locally for the diff below.
          fetch-depth: 0

      - name: Fail on a changed migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-status "$BASE_SHA" HEAD -- src/backend/prisma/migrations/ \
            | grep -v '^A' || true)

          if [ -z "$changed" ]; then
            echo "No committed migration was changed; new migrations are unrestricted."
            exit 0
          fi

          # `make refresh-static-data` legitimately rewrites 1_seed_static_data.
          # It is allowed through, because the alternative is that the workflow
          # cannot land at all — but it has to be deliberate, and the PR has to
          # carry the SQL that applies the same change to already-seeded
          # databases, production included.
          case "$PR_TITLE" in
            *"[refresh-static-data]"*)
              echo "::warning::This PR edits an applied migration under a [refresh-static-data] marker."
              echo "$changed"
              echo "Production has already applied these files, so the deploy will NOT pick the change up."
              echo "The PR body must carry the SQL that brings already-seeded databases in line."
              exit 0
              ;;
          esac

          # No backticks in the message: this is a double-quoted shell string,
          # where they would be command substitution rather than punctuation.
          echo "::error::This PR changes a migration that has already been committed, and every database that already applied it will silently ignore the change (prisma migrate deploy does not checksum applied migrations). Add a new migration instead. If this is a deliberate 'make refresh-static-data' refresh, put [refresh-static-data] in the PR title and the catch-up SQL in the PR body."
          echo "$changed"
          exit 1

  # ============================================================================
  # SONARCLOUD
  # ============================================================================
  # Advisory: `deploy` deliberately does not list it in `needs`, and a failed
  # analysis or quality gate leaves the run green.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: [self-hosted, wsl]
    continue-on-error: true
    needs:
      - backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # DEPLOY
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, wsl]
    permissions:
      contents: read
      packages: write
    # Explicit, and deliberately not every job: sonarcloud is advisory and
    # migration-immutability does not run on main.
    needs:
      - backend-lint
      - backend-test
      - backend-build
      - frontend-lint
      - frontend-typecheck
      - frontend-messages
      - frontend-test
      - frontend-build
      - python-test
      - openapi-drift
      - barrels-drift
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `docker login` writes the token to $DOCKER_CONFIG/config.json, which
      # defaults to ~/.docker — on this runner, a volume that outlives the job.
      # GITHUB_TOKEN expires with the job anyway; keeping it out of the volume
      # means nothing has to rely on that.
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Plain `docker build` against the host daemon, whose layer cache persists
      # between runs — no buildx builder, no cache export or import.
      - name: Build images
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          docker build -f docker/backend/Dockerfile --target prod \
            -t "$IMAGE/backend:$SHA" -t "$IMAGE/backend:latest" .
          # Same Dockerfile, `migrate` target — shares the backend's cached base
          # layers, so this adds seconds, not a build.
          docker build -f docker/backend/Dockerfile --target migrate \
            -t "$IMAGE/backend-migrate:$SHA" -t "$IMAGE/backend-migrate:latest" .
          # The scheduler generates every match, stat and shot chart. It is
          # built and published like the rest so the deploy carries it, and so
          # it has a :SHA tag to roll back to.
          docker build -f docker/python-script/Dockerfile \
            -t "$IMAGE/scheduler:$SHA" -t "$IMAGE/scheduler:latest" .
          # SENTRY_AUTH_TOKEN goes in as a BuildKit secret, never a build arg:
          # the Dockerfile mounts it at /run/secrets/sentry_auth_token, and an
          # ARG/ENV would persist in the image config that gets pushed.
          umask 077
          printf '%s' "$SENTRY_AUTH_TOKEN" > "$RUNNER_TEMP/sentry_auth_token"
          docker build -f docker/frontend/Dockerfile --target prod \
            --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
            --build-arg "FRONTEND_URL=$FRONTEND_URL" \
            --secret id=sentry_auth_token,src="$RUNNER_TEMP/sentry_auth_token" \
            -t "$IMAGE/frontend:$SHA" -t "$IMAGE/frontend:latest" .

      # Push this commit's two tags by name, never --all-tags: the daemon is
      # long-lived, so --all-tags re-sends every SHA tag it has ever built — one
      # registry round trip per tag per image. The SHA tag is then dropped
      # locally; :latest keeps the image, and BuildKit's cache is not tied to
      # tags. A failed untag is housekeeping, so it must not fail the deploy.
      - name: Push images
        run: |
          for n in backend backend-migrate scheduler frontend; do
            docker push "$IMAGE/$n:$SHA"
            docker push "$IMAGE/$n:latest"
            docker image rm "$IMAGE/$n:$SHA" || true
          done

      # Plain ssh instead of a third-party action: the deploy is simple enough
      # that no external action needs to handle the SSH key. Secrets are passed
      # as env vars, never expanded into script text; the remote script can't
      # see runner env, so non-secrets ride an env prefix on the ssh command
      # and the registry token is the first line of stdin, read before the
      # script.
      - name: Deploy via SSH
        timeout-minutes: 10
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          # A token of its own rather than GITHUB_TOKEN, which dies with the job
          # — the VPS keeps this login, and a later manual `docker compose pull`
          # there needs it to still work. A classic PAT with read:packages only.
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          # Key and known_hosts live in $RUNNER_TEMP, emptied after the job; ~/.ssh
          # is on the runner's persistent volume and would keep the key.
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          # Normalised rather than copied straight across. A key pasted from a
          # Windows editor carries CRLF line endings, and one pasted without its
          # final newline ends mid-line; OpenSSH rejects both identically, with
          # "error in libcrypto" and no indication of which. The value is a
          # secret nobody can eyeball in the UI, so the workflow repairs what it
          # can instead of depending on how it was pasted.
          (umask 077 && printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key")
          # Fail here, with a readable message, rather than 40 lines later on a
          # "Permission denied (publickey)" that looks like a VPS-side problem.
          if ! ssh-keygen -y -f "$key" > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key after normalisation. Re-paste it from the raw file, including the final newline."
            exit 1
          fi
          # The host key is pinned, not discovered. ssh-keyscan would re-learn
          # the key on every deploy and trust whatever answered — anyone able to
          # intercept runner → VPS receives the registry token on stdin and runs
          # this script as `deploy`, which is in the `docker` group and so
          # root-equivalent in practice.
          #
          # VPS_HOST_KEY holds the key material only ("ssh-ed25519 AAAA…"), not
          # a full known_hosts line, so the host label below always matches the
          # address ssh is about to use. Refresh it after checking the
          # fingerprint against the Hetzner console:
          #   ssh-keyscan -t ed25519 <VPS_HOST> | grep -v '^#' | cut -d' ' -f2-
          if [ -z "$VPS_HOST_KEY" ]; then
            echo "::error::VPS_HOST_KEY is not set. Deploying would mean trusting an unverified SSH host key, so this step fails instead."
            exit 1
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > "$known_hosts"
          {
          printf '%s\n' "$DEPLOY_REGISTRY_TOKEN"
          cat <<'DEPLOY'
          set -e
          cd /opt/beyondthearc
          # Remembered across the pull so the Grafana reload below can tell
          # whether this deploy actually changed any alerting provisioning.
          pre_pull_head=$(git rev-parse HEAD)
          git pull
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "$DEPLOY_REGISTRY_USER" --password-stdin
          # Pin the deployed images to this commit's tag. Persisted in .env so
          # any later manual `compose up` keeps running the same images instead
          # of silently jumping to whatever :latest points at.
          # Rollback = set IMAGE_TAG to a previous SHA and rerun pull + up.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_TAG/" .env
          else
            echo "IMAGE_TAG=$DEPLOY_TAG" >> .env
          fi
          echo "Disk before pull:" && df -h / | tail -1
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull frontend backend migrate scheduler
          docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
          # Pull first, prune second. Every deploy pins :SHA tags, so old tagged
          # images accumulate until the disk health indicator trips (>90% of /)
          # — they do have to go. But pruning before the pull means a registry
          # that refuses the login, or a tag that was never pushed, lands on a
          # host whose previous images have already been deleted: production
          # down, with nothing local to roll back to. Pruning after a successful
          # pull turns that same failure into a red run and an untouched host.
          #
          # Safe to run while the new containers are up: it removes images no
          # container references, and `up -d` above has already moved them onto
          # the new ones. All tags remain in the registry, so rollback re-pulls
          # by IMAGE_TAG and local copies of old images are not needed.
          echo "Disk before image prune:" && df -h / | tail -1
          docker image prune -af
          echo "Disk after image prune:" && df -h / | tail -1
          # Prometheus reads its scrape config only at startup, and `up -d`
          # recreates a container when its *configuration* changes — a
          # bind-mounted file's contents are not part of that hash. So a new
          # scrape job lands on disk and is never loaded.
          #
          # This must run BEFORE the Grafana restart below. An alert whose
          # series does not exist yet reads NoData, and the availability rules
          # set `noDataState: Alerting` on purpose — so restarting Grafana first
          # would fire a false alert for the two minutes it takes Prometheus to
          # come back and scrape.
          if ! git diff --quiet "$pre_pull_head" HEAD -- docker/config/prometheus.yml docker/config/blackbox.yml; then
            echo "Prometheus or blackbox config changed in this deploy — restarting both to load it"
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml restart blackbox-exporter prometheus
          fi
          # Grafana reads provisioning/alerting/*.yml only at startup, and the
          # same configuration-hash rule applies. Conditional rather than
          # unconditional because a restart restarts the `for:` clocks, which run
          # 2-10 minutes here — an unrelated deploy should not delay a pending
          # Disk Full by ten minutes. Dashboards need no equivalent: their
          # provider sets no updateIntervalSeconds, so Grafana's own poll picks
          # them up.
          if ! git diff --quiet "$pre_pull_head" HEAD -- docker/config/grafana/provisioning/alerting/; then
            echo "Alerting provisioning changed in this deploy — restarting Grafana to load it"
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml restart grafana
          fi
          # Fail the deploy if the new containers don't come up healthy — a
          # crash-looping container should be a red run, not a Grafana alert.
          backend_ok=""
          for i in $(seq 1 12); do
            if curl -fsS -m 5 http://localhost:4000/api/health/ready > /dev/null 2>&1; then
              backend_ok=1
              break
            fi
            sleep 5
          done
          if [ -z "$backend_ok" ]; then
            echo "::error::Backend failed health check after 60s — deploy failed, prod may be degraded. Roll back via IMAGE_TAG in .env."
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml logs --tail 50 backend
            exit 1
          fi
          echo "Backend healthy."
          # The same retry loop as the backend, and it has to be one.
          # `frontend.depends_on` waits for `service_healthy`, so the frontend
          # starts *after* the loop above succeeds — a single un-retried curl
          # fires against a socket that is not listening yet, exits 56, and
          # `set -e` kills the deploy before the `if` below can report a code.
          #
          # `frontend_code` is assigned inside the `if` condition on purpose:
          # under `set -e` a bare `x=$(curl ...)` that cannot connect aborts the
          # script.
          frontend_ok=""
          frontend_code=""
          for i in $(seq 1 12); do
            if frontend_code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://localhost:3000/en) \
               && [ "$frontend_code" = "200" ]; then
              frontend_ok=1
              break
            fi
            sleep 5
          done
          if [ -z "$frontend_ok" ]; then
            echo "::error::Frontend failed health check after 60s (last HTTP '$frontend_code') — deploy failed, prod may be degraded. Roll back via IMAGE_TAG in .env."
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml logs --tail 50 frontend
            exit 1
          fi
          echo "Frontend healthy."
          # Prune only after the new containers proved healthy.
          docker system prune -f
          DEPLOY
          # VPS_USER is `deploy`, an unprivileged account that owns
          # /opt/beyondthearc and belongs to the `docker` group. The group is
          # what makes every command above work, and it is also root-equivalent
          # (`docker run -v /:/host`), so this is an audit-trail and
          # accident-blast-radius boundary, not a containment one. Bounding what
          # a stolen VPS_SSH_KEY can do needs an authorized_keys forced command.
          } | ssh -i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              "REGISTRY_HOST=ghcr.io DEPLOY_REGISTRY_USER='$DEPLOY_REGISTRY_USER' DEPLOY_TAG='$SHA' sh -c 'read -r REGISTRY_TOKEN && export REGISTRY_TOKEN && exec bash -s'"
