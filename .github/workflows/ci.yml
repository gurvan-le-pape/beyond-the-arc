name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger — lets a deploy be re-run from the Actions UI (or via
  # `gh workflow run ci.yml --ref main`) when a push event fails to fire.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main — the deploy job does a live `docker compose up`
  # + SSH deploy, and cancelling it mid-flight could leave the VPS half-deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # BACKEND
  # ============================================================================
  backend-lint:
    name: Backend – Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      # The eslint config is type-aware, and 11 source files import from
      # prisma/generated — which is gitignored and, since Prisma 7 dropped its
      # postinstall, is not created by `npm ci`. Without this the whole Prisma
      # surface types as `any` here, and rules like no-floating-promises stop
      # firing on exactly the call sites they matter most on. `npm test` and
      # `npm run build` both generate first, so this job was the only gap.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Same gap the frontend had: Prettier is not part of the eslint config,
      # so nothing checked it here and four files had drifted.
      - name: Format
        run: npm run format:check

  backend-test:
    name: Backend – Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage/lcov.info

  backend-build:
    name: Backend – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Build
        run: npm run build

  # ============================================================================
  # FRONTEND
  # ============================================================================
  frontend-lint:
    name: Frontend – Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Lint
        run: npm run lint

      # Prettier is not part of the eslint config, so nothing was checking it in
      # CI and 21 files had drifted by the time this was added.
      - name: Format
        run: npm run format:check

  frontend-typecheck:
    name: Frontend – Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Typecheck
        run: npm run typecheck

  frontend-messages:
    name: Frontend – Message parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Check message parity
        run: npm run check:messages

  frontend-build:
    name: Frontend – Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build
        run: npm run build

  # ============================================================================
  # API CONTRACT
  # ============================================================================
  # Regenerates docs/openapi.json from the backend and the frontend's
  # api.generated.ts from that document, then fails if either differs from
  # what is committed — backend DTO changes must ship with regenerated types.
  openapi-drift:
    name: OpenAPI – Drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Setup frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build backend
        working-directory: src/backend
        run: npm run build

      - name: Regenerate OpenAPI document
        working-directory: src/backend
        run: node dist/scripts/generate-openapi.js

      - name: Regenerate frontend API types
        working-directory: src/frontend
        run: npm run typegen

      - name: Fail on drift
        run: |
          git diff --exit-code docs/openapi.json src/frontend/shared/types/api.generated.ts || {
            echo "::error::docs/openapi.json or api.generated.ts is stale — run the backend build, node dist/scripts/generate-openapi.js ../../docs/openapi.json, then npm run typegen in src/frontend, and commit the result."
            exit 1
          }

  # ============================================================================
  # BARRELS
  # ============================================================================
  # The root project is installed by nothing else in CI — every `npm ci` goes
  # through setup-app with src/backend or src/frontend — so barrelsby.json and
  # the 88 barrels it generates were verified nowhere.
  #
  # Two halves, because they catch different things. Regenerating and diffing
  # catches a barrel whose *content* has gone stale. It does NOT catch a defect
  # in the config: an unrecognised key and a directory with no barrel both emit
  # byte-identical output, which is exactly how three of them survived. The
  # script covers that half.
  barrels-drift:
    name: Barrels – Config and drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup root
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      # barrels:lint runs eslint --fix over the generated frontend barrels,
      # which needs the frontend's own config and plugins installed.
      - name: Setup frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Validate barrelsby.json
        run: node scripts/check-barrels-config.mjs

      - name: Regenerate barrels
        run: npm run barrels

      - name: Fail on drift
        run: |
          git diff --exit-code || {
            echo "::error::Generated barrels are stale. Run 'make barrels' (or 'npm run barrels') and commit the result."
            exit 1
          }

  # ============================================================================
  # MIGRATIONS
  # ============================================================================
  # `prisma migrate deploy` does not checksum migrations it has already applied
  # — it branches on the pending count alone, so an edited migration file is
  # silently ignored on every database that already ran it, while a fresh one
  # gets the new content. Nothing reports the divergence. This job is the only
  # mechanical enforcement of CLAUDE.md's "Never edit an applied migration".
  #
  # Pull requests only: on a push to main there is nothing left to gate.
  migration-immutability:
    name: Migrations – No edits to applied migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit must be present locally for the diff below.
          fetch-depth: 0

      - name: Fail on a changed migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-status "$BASE_SHA" HEAD -- src/backend/prisma/migrations/ \
            | grep -v '^A' || true)

          if [ -z "$changed" ]; then
            echo "No committed migration was changed; new migrations are unrestricted."
            exit 0
          fi

          # `make refresh-static-data` legitimately rewrites 1_seed_static_data.
          # It is allowed through, because the alternative is that the workflow
          # cannot land at all — but it has to be deliberate, and the PR has to
          # carry the SQL that applies the same change to already-seeded
          # databases, production included.
          case "$PR_TITLE" in
            *"[refresh-static-data]"*)
              echo "::warning::This PR edits an applied migration under a [refresh-static-data] marker."
              echo "$changed"
              echo "Production has already applied these files, so the deploy will NOT pick the change up."
              echo "The PR body must carry the SQL that brings already-seeded databases in line."
              exit 0
              ;;
          esac

          # No backticks in the message: this is a double-quoted shell string,
          # where they would be command substitution rather than punctuation.
          echo "::error::This PR changes a migration that has already been committed, and every database that already applied it will silently ignore the change (prisma migrate deploy does not checksum applied migrations). Add a new migration instead. If this is a deliberate 'make refresh-static-data' refresh, put [refresh-static-data] in the PR title and the catch-up SQL in the PR body."
          echo "$changed"
          exit 1

  # ============================================================================
  # SONARCLOUD
  # ============================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs:
      - backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # DEPLOY
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - backend-lint
      - backend-test
      - backend-build
      - frontend-lint
      - frontend-typecheck
      - frontend-messages
      - frontend-build
      - openapi-drift
      - barrels-drift
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for cache-to/cache-from type=gha — the default docker driver
      # cannot export cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/backend/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Same Dockerfile, `migrate` target — shares the backend's cached base
      # layers, so this adds seconds, not a build.
      - name: Build and push migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/backend/Dockerfile
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend-migrate:latest
            ghcr.io/${{ github.repository }}/backend-migrate:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}

      # Plain ssh instead of a third-party action: the deploy is simple enough
      # that no external action needs to handle the SSH key. Secrets are passed
      # as env vars, never expanded into script text; the remote script can't
      # see runner env, so non-secrets ride an env prefix on the ssh command
      # and the GHCR token is the first line of stdin, read before the script.
      - name: Deploy via SSH
        timeout-minutes: 10
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned, not discovered. The runner is ephemeral, so
          # ssh-keyscan would re-learn the key on every deploy and trust
          # whatever answered — anyone able to intercept runner → VPS receives
          # the GHCR token on stdin and runs this script as `deploy`, which is
          # in the `docker` group and so root-equivalent in practice.
          #
          # VPS_HOST_KEY holds the key material only ("ssh-ed25519 AAAA…"), not
          # a full known_hosts line, so the host label below always matches the
          # address ssh is about to use. Refresh it after checking the
          # fingerprint against the Hetzner console:
          #   ssh-keyscan -t ed25519 <VPS_HOST> | grep -v '^#' | cut -d' ' -f2-
          if [ -z "$VPS_HOST_KEY" ]; then
            echo "::error::VPS_HOST_KEY is not set. Deploying would mean trusting an unverified SSH host key, so this step fails instead."
            exit 1
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
          printf '%s\n' "$GHCR_TOKEN"
          cat <<'DEPLOY'
          set -e
          cd /opt/beyondthearc
          git pull
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Pin the deployed images to this commit's tag. Persisted in .env so
          # any later manual `compose up` keeps running the same images
          # instead of silently jumping to whatever :latest points at.
          # Rollback = set IMAGE_TAG to a previous SHA and rerun pull + up.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_TAG/" .env
          else
            echo "IMAGE_TAG=$DEPLOY_TAG" >> .env
          fi
            # Remove images not referenced by any container before pulling new
            # ones. The post-deploy `docker system prune -f` only drops
            # *dangling* images, but every deploy pins :SHA tags, so old
            # tagged images accumulated until the disk health indicator
            # tripped (>90% of /). All tags remain in GHCR; rollback re-pulls
            # by IMAGE_TAG, so local copies of old images are not needed.
            echo "Disk before image prune:" && df -h / | tail -1
            docker image prune -af
            echo "Disk after image prune:" && df -h / | tail -1
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml pull frontend backend migrate
            docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
            # Fail the deploy if the new containers don't come up healthy —
            # a crash-looping container should be a red pipeline, not a
            # Grafana alert. Rollback: set IMAGE_TAG in .env to the previous
            # SHA, then rerun the pull + up commands above.
            backend_ok=""
            for i in $(seq 1 12); do
              if curl -fsS -m 5 http://localhost:4000/api/health/ready > /dev/null 2>&1; then
                backend_ok=1
                break
              fi
              sleep 5
            done
            if [ -z "$backend_ok" ]; then
              echo "::error::Backend failed health check after 60s — deploy failed, prod may be degraded. Roll back via IMAGE_TAG in .env."
              docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml logs --tail 50 backend
              exit 1
            fi
            echo "Backend healthy."
            frontend_code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' http://localhost:3000/en)
            if [ "$frontend_code" != "200" ]; then
              echo "::error::Frontend returned HTTP $frontend_code — deploy failed, prod may be degraded. Roll back via IMAGE_TAG in .env."
              docker compose --env-file .env -f docker/docker-compose.yml -f docker/docker-compose.prod.yml logs --tail 50 frontend
              exit 1
            fi
            echo "Frontend healthy."
            # Prune only after the new containers proved healthy.
            docker system prune -f
          DEPLOY
          # VPS_USER is `deploy`, an unprivileged account that owns
          # /opt/beyondthearc and belongs to the `docker` group. The group is
          # what makes every command above work, and it is also root-equivalent
          # (`docker run -v /:/host`), so this is an audit-trail and
          # accident-blast-radius boundary, not a containment one. Bounding what
          # a stolen VPS_SSH_KEY can do needs an authorized_keys forced command.
          } | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              "GHCR_USER='$GHCR_USER' DEPLOY_TAG='$DEPLOY_TAG' sh -c 'read -r GHCR_TOKEN && export GHCR_TOKEN && exec bash -s'"
