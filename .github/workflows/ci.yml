name: CI

# Every job runs on the self-hosted runners (docs/ci-cd.md, "GitHub Actions"),
# containers with the host Docker socket mounted. Their home directory persists
# between jobs: the npm and tool caches stay warm, and no secret may be written
# there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: cancelling a deploy could leave the VPS half-deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # BACKEND
  # ============================================================================

  # One install for every check. Each step runs even if an earlier one failed, so one
  # run shows every problem; lint comes before the steps that write coverage/ and dist/.
  #
  # The eslint config is type-aware and the Prisma client is gitignored: without
  # `prisma generate` its whole surface types as `any` and rules like
  # no-floating-promises stop firing on exactly the calls they matter most on.
  backend:
    name: Backend
    runs-on: [self-hosted, wsl]
    env:
      PG: integration-pg-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup src/backend
        id: setup
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Generate Prisma client
        id: generate
        run: npx prisma generate

      - name: Lint
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run format:check

      - name: Unit tests with coverage
        id: unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage/lcov.info
          retention-days: 7

      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build

      # Not `services:`. The runner is itself a container, and Actions publishes a
      # service's port on the Docker host, which is not this job's localhost. Sharing
      # the runner's network namespace makes it so, and keeps parallel jobs apart.
      - name: Start PostgreSQL
        id: postgres
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          docker rm -fv "$PG" >/dev/null 2>&1 || true
          docker run -d --name "$PG" --network "container:$(hostname)" \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=beyondthearc_test postgres:18.7
          for _ in $(seq 1 60); do
            # Over TCP: during initialisation the server listens on its Unix socket only.
            if docker exec "$PG" pg_isready -q -h 127.0.0.1 -U postgres -d beyondthearc_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 50 "$PG"
          exit 1

      - name: Migrate and run integration tests
        if: ${{ !cancelled() && steps.postgres.outcome == 'success' }}
        env:
          # The harness refuses any database whose name does not end in _test.
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beyondthearc_test
        run: |
          npx prisma migrate deploy
          npm run test:integration

      - name: Remove PostgreSQL
        if: always()
        working-directory: .
        run: docker rm -fv "$PG" || true

  # ============================================================================
  # FRONTEND
  # ============================================================================

  # Same shape as `backend`. Lint comes before the tests, which write coverage/.
  frontend:
    name: Frontend
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup src/frontend
        id: setup
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run format:check

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck

      - name: Message parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:messages

      - name: Unit tests with coverage
        id: unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test -- --coverage

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: src/frontend/coverage/lcov.info
          retention-days: 7

  # ============================================================================
  # SCHEDULER
  # ============================================================================

  scheduler:
    name: Scheduler
    runs-on: [self-hosted, wsl]
    defaults:
      run:
        working-directory: src/backend/db/python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        id: setup
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      # A measurement: its findings do not fail the job, and neither does a crash.
      - name: Ruff report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: ruff check --exit-zero --no-cache --output-format concise .

  # ============================================================================
  # CONTRACTS: MIGRATIONS, OPENAPI, BARRELS, DEPENDENCY RULES
  # ============================================================================

  # Same shape as `backend`. The order matters: dependency-cruiser needs the root
  # install alone, knip reads the tree before anything is built in it, and the barrels
  # come last because their check looks at the whole tree.
  contracts:
    name: Contracts
    runs-on: [self-hosted, wsl]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `prisma migrate deploy` does not checksum applied migrations, so an edit is
      # silently ignored everywhere it already ran. Nothing else reports it.
      - name: Fail on a changed migration
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-status "$BASE_SHA...HEAD" -- src/backend/prisma/migrations/ \
            | grep -v '^A' || true)

          if [ -z "$changed" ]; then
            echo "No committed migration was changed; new migrations are unrestricted."
            exit 0
          fi

          # The sanctioned `make refresh-static-data` rewrite, see docs/data-pipeline.md.
          case "$PR_TITLE" in
            *"[refresh-static-data]"*)
              echo "::warning::This PR edits an applied migration under a [refresh-static-data] marker. The deploy will NOT pick it up: the PR body must carry the catch-up SQL."
              echo "$changed"
              exit 0
              ;;
          esac

          echo "::error::This PR changes a migration that has already been committed; every database that applied it will silently ignore the change. Add a new migration instead."
          echo "$changed"
          exit 1

      - name: Setup .
        id: root
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      # Advisory: a finding can be the right trade on a small table.
      - name: Squawk
        if: ${{ !cancelled() && steps.root.outcome == 'success' && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA...HEAD" -- 'src/backend/prisma/migrations/*/migration.sql')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No migration added."
            exit 0
          fi
          npx squawk "${added[@]}"

      - name: Dependency rules
        if: ${{ !cancelled() && steps.root.outcome == 'success' }}
        run: npm run quality:deps

      - name: Setup src/backend
        id: backend
        if: ${{ !cancelled() && steps.root.outcome == 'success' }}
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Setup src/frontend
        id: frontend
        if: ${{ !cancelled() && steps.root.outcome == 'success' }}
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      # A measurement: its findings do not fail the job, and neither does a crash.
      - name: Quality report
        if: ${{ !cancelled() && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success' }}
        continue-on-error: true
        run: npm run quality

      # Regenerates the OpenAPI document and the frontend types from it, and fails if
      # either differs from the commit. The checkout keeps that drift out of the
      # barrels check below.
      - name: OpenAPI drift
        if: ${{ !cancelled() && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          generated=(docs/openapi.json src/frontend/shared/types/api.generated.ts)
          trap 'git checkout -- "${generated[@]}"' EXIT
          (cd src/backend && npm run build && node dist/scripts/generate-openapi.js)
          (cd src/frontend && npm run typegen)
          git diff --exit-code "${generated[@]}" || {
            echo "::error::docs/openapi.json or api.generated.ts is stale — from src/backend run 'npm run build && node dist/scripts/generate-openapi.js', then from src/frontend run 'npm run typegen', and commit both files."
            exit 1
          }

      # barrels:lint runs eslint over both applications' barrels, so all three projects
      # are installed.
      - name: Barrels drift
        if: ${{ !cancelled() && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success' }}
        run: |
          npm run barrels
          # `git add -A` first: `git diff` alone does not see an untracked barrel.
          git add -A
          git diff --cached --exit-code || {
            echo "::error::Generated barrels are stale. Run 'make barrels' (or 'npm run barrels') and commit the result."
            exit 1
          }

  # ============================================================================
  # IMAGES
  # ============================================================================

  # A run has exactly one of these two jobs: what ships is built and started by `images`
  # on main, and `images-check` does the same elsewhere without any secret or write
  # access. Both start the images they built.
  #
  # `images-check` uses other frontend URLs on purpose. The daemon's layer cache is
  # shared and a BuildKit secret is not part of the cache key: with the same build args,
  # main would reuse a frontend built here, whose source maps never reached Sentry.
  images-check:
    name: Images – Check
    runs-on: [self-hosted, wsl]
    if: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
    env:
      PREFIX: images-check
      TAG: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the images
        uses: ./.github/actions/build-images
        with:
          prefix: ${{ env.PREFIX }}
          tag: ${{ env.TAG }}
          next-public-api-url: https://images-check.invalid/api
          frontend-url: https://images-check.invalid

      - name: Remove the images
        if: always()
        run: docker image rm "$PREFIX"/{backend,backend-migrate,scheduler,frontend}:"$TAG" || true

  # Pushes this commit's tag only, after the images started. `deploy` moves `latest`.
  #
  # The environment accepts main only and holds the Sentry token and nothing of the
  # server's: this job runs the build scripts of every dependency. `deployment: false`
  # keeps a build out of the deployments list.
  images:
    name: Images
    runs-on: [self-hosted, wsl]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: build
      deployment: false
    outputs:
      digests: ${{ steps.push.outputs.digests }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the Sentry token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set in the build environment."
            exit 1
          fi

      - name: Build and start the images
        uses: ./.github/actions/build-images
        with:
          prefix: ${{ env.IMAGE }}
          tag: ${{ env.SHA }}
          next-public-api-url: ${{ vars.NEXT_PUBLIC_API_URL }}
          frontend-url: ${{ vars.FRONTEND_URL }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # The daemon's image store is containerd's, where an image's ID is the digest a
      # push publishes: comparing them proves that what was started is what was pushed.
      # Digests only in the output: GitHub drops one that contains a secret's value,
      # and the registry path contains a user name.
      - name: Push images
        id: push
        run: |
          digests=""
          for n in backend backend-migrate scheduler frontend; do
            docker push --quiet "$IMAGE/$n:$SHA"
            started=$(docker image inspect -f '{{.Id}}' "$IMAGE/$n:$SHA")
            pushed=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE/$n:$SHA" | tr -d '"')
            if [ "$started" != "$pushed" ]; then
              echo "::error::$n: started $started but the registry has $pushed"
              exit 1
            fi
            digests+="${digests:+,}$n=$pushed"
          done
          echo "$digests"
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

      - name: Remove the images
        if: always()
        run: docker image rm "$IMAGE"/{backend,backend-migrate,scheduler,frontend}:"$SHA" || true

  # ============================================================================
  # WORKFLOWS AND SHELL SCRIPTS
  # ============================================================================

  infra:
    name: Infra
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows and scripts
        run: scripts/ci/lint-infra.sh

  # ============================================================================
  # REPORT (advisory, not a deploy gate)
  # ============================================================================

  # Runs only while the repository variable SONAR_ENABLED is `true`.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: [self-hosted, wsl]
    needs: [backend, frontend]
    if: vars.SONAR_ENABLED == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: src/frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # GATE
  # ============================================================================

  # Every job that may stop a merge or a deploy. `always()`: without it a failed job
  # would leave this one skipped, and GitHub counts a skipped required check as passed.
  # Anything but `success` fails, a skip and a cancellation included, except the skip of
  # the one images job this event does not run, which must be skipped.
  gate:
    name: gate
    runs-on: [self-hosted, wsl]
    if: always()
    needs:
      - backend
      - frontend
      - images-check
      - images
      - contracts
      - infra
      - scheduler
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'images-check' || 'images' }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$NEEDS"
          jq -e --arg skipped "$SKIPPED" 'has($skipped) and
            all(to_entries[]; .value.result == if .key == $skipped then "skipped" else "success" end)' \
            <<< "$NEEDS" > /dev/null || {
            echo "::error::A required job did not succeed."
            exit 1
          }

  # ============================================================================
  # DEPLOY
  # ============================================================================

  # Runs only while the repository variable DEPLOY_ENABLED is `true`.
  #
  # Credentials go under $RUNNER_TEMP, which the runner empties after the job: its
  # home directory is a volume that outlives it.
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, wsl]
    needs: [gate, images]
    # `!cancelled()` replaces the implicit success(), which also looks at the jobs
    # behind `gate`; the result of `gate` is what decides.
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://beyondthearc.app
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
      # Kept with the run: re-running this job redeploys the same images.
      DIGESTS: ${{ needs.images.outputs.digests }}
    steps:
      - name: Deploy over SSH
        timeout-minutes: 10
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          umask 077
          # OpenSSH rejects CRLF and a missing final newline with the same unhelpful error.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          if ! ssh-keygen -y -f "$key" > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key."
            exit 1
          fi
          # Pinned, never learned with ssh-keyscan: whoever answers gets the registry token.
          # VPS_HOST_KEY is the key material only ("ssh-ed25519 AAAA…").
          if [ -z "$DIGESTS" ]; then
            echo "::error::The images job published no digests."
            exit 1
          fi
          if [ -z "$VPS_HOST_KEY" ] || [ -z "$DEPLOY_REGISTRY_TOKEN" ]; then
            echo "::error::VPS_HOST_KEY or DEPLOY_REGISTRY_TOKEN is not set."
            exit 1
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > "$known_hosts"
          # The token is the first line of stdin, never an argument: those show in `ps`.
          printf '%s\n' "$DEPLOY_REGISTRY_TOKEN" |
            ssh -i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "bash /opt/beyondthearc/docker/deploy.sh '$SHA' ghcr.io '$DEPLOY_REGISTRY_USER' '$DIGESTS'"

      # Only now: `latest` always names images that were deployed. On the registry,
      # so nothing is pulled or rebuilt.
      - name: Move the latest tags
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for pair in ${DIGESTS//,/ }; do
            docker buildx imagetools create --tag "$IMAGE/${pair%%=*}:latest" "$IMAGE/${pair%%=*}@${pair#*=}"
          done
