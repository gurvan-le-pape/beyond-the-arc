name: CI

# Every job runs on the self-hosted runners (docs/ci-cd.md, "GitHub Actions"),
# containers with the host Docker socket mounted. Their home directory persists
# between jobs: the npm and tool caches stay warm, and no secret may be written
# there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: cancelling a deploy could leave the VPS half-deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # BACKEND
  # ============================================================================

  # The eslint config is type-aware and the Prisma client is gitignored: without
  # `prisma generate` its whole surface types as `any` and rules like
  # no-floating-promises stop firing on exactly the calls they matter most on.
  backend-lint:
    name: Backend – Lint
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Generate Prisma client
        working-directory: src/backend
        run: npx prisma generate

      - name: Lint
        working-directory: src/backend
        run: npm run lint

      - name: Format
        working-directory: src/backend
        run: npm run format:check

  backend-test:
    name: Backend – Tests
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Run tests with coverage
        working-directory: src/backend
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage/lcov.info
          retention-days: 7

  # Not `services:`. The runner is itself a container, and Actions publishes a
  # service's port on the Docker host, which is not this job's localhost. Sharing
  # the runner's network namespace makes it so, and keeps parallel jobs apart.
  backend-integration:
    name: Backend – Integration tests
    runs-on: [self-hosted, wsl]
    env:
      PG: integration-pg-${{ github.run_id }}-${{ github.run_attempt }}
      # The harness refuses any database whose name does not end in _test.
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/beyondthearc_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Start PostgreSQL
        run: |
          docker rm -fv "$PG" >/dev/null 2>&1 || true
          docker run -d --name "$PG" --network "container:$(hostname)" \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=beyondthearc_test postgres:18.4
          for _ in $(seq 1 60); do
            # Over TCP: during initialisation the server listens on its Unix socket only.
            if docker exec "$PG" pg_isready -q -h 127.0.0.1 -U postgres -d beyondthearc_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 50 "$PG"
          exit 1

      - name: Migrate
        working-directory: src/backend
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: src/backend
        run: npm run test:integration

      - name: Remove PostgreSQL
        if: always()
        run: docker rm -fv "$PG" || true

  backend-build:
    name: Backend – Build
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Build
        working-directory: src/backend
        run: npm run build

  # Starts the production image for real, on the host Docker daemon. A cancelled
  # job can skip the script's own cleanup, and the daemon is long-lived.
  backend-boot:
    name: Backend – Boot check
    runs-on: [self-hosted, wsl]
    env:
      # Names the script's containers, network and images.
      CI_JOB_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the production image
        run: sh scripts/ci/backend-boot-check.sh

      - name: Remove leftovers
        if: cancelled()
        run: |
          docker rm -fv "backend-boot-app-$CI_JOB_ID" "backend-boot-db-$CI_JOB_ID" || true
          docker network rm "backend-boot-$CI_JOB_ID" || true
          docker image rm "backend-boot:$CI_JOB_ID" "backend-boot-migrate:$CI_JOB_ID" || true

  # ============================================================================
  # FRONTEND
  # ============================================================================

  frontend-lint:
    name: Frontend – Lint
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Format
        working-directory: src/frontend
        run: npm run format:check

  frontend-typecheck:
    name: Frontend – Typecheck
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

  frontend-messages:
    name: Frontend – Message parity
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Check message parity
        working-directory: src/frontend
        run: npm run check:messages

  frontend-test:
    name: Frontend – Unit tests
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Run tests with coverage
        working-directory: src/frontend
        run: npm run test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: src/frontend/coverage/lcov.info
          retention-days: 7

  frontend-build:
    name: Frontend – Build
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build
        working-directory: src/frontend
        run: npm run build

  # ============================================================================
  # SCHEDULER
  # ============================================================================

  python-test:
    name: Scheduler – Tests
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: src/backend/db/python
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: src/backend/db/python
        run: python -m pytest

  # ============================================================================
  # API CONTRACT, BARRELS, DEPENDENCY RULES
  # ============================================================================

  # Regenerates the OpenAPI document and the frontend types from it, and fails if
  # either differs from the commit.
  openapi-drift:
    name: OpenAPI – Drift check
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Build backend
        working-directory: src/backend
        run: npm run build

      - name: Regenerate OpenAPI document
        working-directory: src/backend
        run: node dist/scripts/generate-openapi.js

      - name: Regenerate frontend API types
        working-directory: src/frontend
        run: npm run typegen

      - name: Fail on drift
        run: |
          git diff --exit-code docs/openapi.json src/frontend/shared/types/api.generated.ts || {
            echo "::error::docs/openapi.json or api.generated.ts is stale — from src/backend run 'npm run build && node dist/scripts/generate-openapi.js', then from src/frontend run 'npm run typegen', and commit both files."
            exit 1
          }

  # barrels:lint runs eslint over both applications' barrels, so all three projects
  # are installed.
  barrels-drift:
    name: Barrels – Drift check
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Regenerate barrels
        run: npm run barrels

      - name: Fail on drift
        run: |
          # `git add -A` first: `git diff` alone does not see an untracked barrel.
          git add -A
          git diff --cached --exit-code || {
            echo "::error::Generated barrels are stale. Run 'make barrels' (or 'npm run barrels') and commit the result."
            exit 1
          }

  dependency-rules:
    name: Dependency rules
    runs-on: [self-hosted, wsl]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      - name: Check module boundaries
        run: npm run quality:deps

  # ============================================================================
  # MIGRATIONS (pull requests only)
  # ============================================================================

  # `prisma migrate deploy` does not checksum applied migrations, so an edit is
  # silently ignored everywhere it already ran. Nothing else reports it.
  migration-immutability:
    name: Migrations – No edits to applied migrations
    runs-on: [self-hosted, wsl]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fail on a changed migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-status "$BASE_SHA...HEAD" -- src/backend/prisma/migrations/ \
            | grep -v '^A' || true)

          if [ -z "$changed" ]; then
            echo "No committed migration was changed; new migrations are unrestricted."
            exit 0
          fi

          # The sanctioned `make refresh-static-data` rewrite, see docs/data-pipeline.md.
          case "$PR_TITLE" in
            *"[refresh-static-data]"*)
              echo "::warning::This PR edits an applied migration under a [refresh-static-data] marker. The deploy will NOT pick it up: the PR body must carry the catch-up SQL."
              echo "$changed"
              exit 0
              ;;
          esac

          echo "::error::This PR changes a migration that has already been committed; every database that applied it will silently ignore the change. Add a new migration instead."
          echo "$changed"
          exit 1

  # Advisory: a finding can be the right trade on a small table.
  squawk:
    name: Migrations – Squawk
    runs-on: [self-hosted, wsl]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      - name: Lint added migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA...HEAD" -- 'src/backend/prisma/migrations/*/migration.sql')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No migration added."
            exit 0
          fi
          npx squawk "${added[@]}"

  # ============================================================================
  # REPORTS (advisory, not deploy gates)
  # ============================================================================

  quality-report:
    name: Quality report
    runs-on: [self-hosted, wsl]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .
        uses: ./.github/actions/setup-app
        with:
          working-directory: .

      - name: Setup src/frontend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/frontend

      - name: Setup src/backend
        uses: ./.github/actions/setup-app
        with:
          working-directory: src/backend

      - name: Report
        run: npm run quality

  ruff-report:
    name: Ruff report
    runs-on: [self-hosted, wsl]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: src/backend/db/python
        run: pip install -r requirements-dev.txt

      - name: Report
        working-directory: src/backend/db/python
        run: ruff check --exit-zero --no-cache --output-format concise .

  # Runs only while the repository variable SONAR_ENABLED is `true`.
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: [self-hosted, wsl]
    needs: [backend-test, frontend-test]
    if: vars.SONAR_ENABLED == 'true'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: src/backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: src/frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================================
  # DEPLOY
  # ============================================================================

  # Runs only while the repository variable DEPLOY_ENABLED is `true`. GitLab's deploy
  # is the fallback, behind GITLAB_DEPLOY: never both. The explicit gates leave the advisory jobs out.
  #
  # Credentials go under $RUNNER_TEMP, which the runner empties after the job: its
  # home directory is a volume that outlives it.
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, wsl]
    needs:
      - backend-lint
      - backend-test
      - backend-integration
      - backend-build
      - backend-boot
      - frontend-lint
      - frontend-typecheck
      - frontend-messages
      - frontend-test
      - frontend-build
      - openapi-drift
      - barrels-drift
      - dependency-rules
      - python-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://beyondthearc.app
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build images
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          docker build -f docker/backend/Dockerfile --target prod \
            -t "$IMAGE/backend:$SHA" -t "$IMAGE/backend:latest" .
          docker build -f docker/backend/Dockerfile --target migrate \
            -t "$IMAGE/backend-migrate:$SHA" -t "$IMAGE/backend-migrate:latest" .
          docker build -f docker/python-script/Dockerfile \
            -t "$IMAGE/scheduler:$SHA" -t "$IMAGE/scheduler:latest" .
          # A BuildKit secret, never a build arg, which would persist in the pushed image.
          umask 077
          printf '%s' "$SENTRY_AUTH_TOKEN" > "$RUNNER_TEMP/sentry_auth_token"
          docker build -f docker/frontend/Dockerfile --target prod \
            --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
            --build-arg "FRONTEND_URL=$FRONTEND_URL" \
            --secret id=sentry_auth_token,src="$RUNNER_TEMP/sentry_auth_token" \
            -t "$IMAGE/frontend:$SHA" -t "$IMAGE/frontend:latest" .

      - name: Push images
        run: |
          # By name, never --all-tags: the long-lived daemon would re-send every SHA.
          for n in backend backend-migrate scheduler frontend; do
            docker push "$IMAGE/$n:$SHA"
            docker push "$IMAGE/$n:latest"
            docker image rm "$IMAGE/$n:$SHA" || true
          done

      - name: Deploy over SSH
        timeout-minutes: 10
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          umask 077
          # OpenSSH rejects CRLF and a missing final newline with the same unhelpful error.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key"
          if ! ssh-keygen -y -f "$key" > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a usable private key."
            exit 1
          fi
          # Pinned, never learned with ssh-keyscan: whoever answers gets the registry token.
          # VPS_HOST_KEY is the key material only ("ssh-ed25519 AAAA…").
          if [ -z "$VPS_HOST_KEY" ] || [ -z "$DEPLOY_REGISTRY_TOKEN" ]; then
            echo "::error::VPS_HOST_KEY or DEPLOY_REGISTRY_TOKEN is not set."
            exit 1
          fi
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > "$known_hosts"
          # The token is the first line of stdin, never an argument: those show in `ps`.
          printf '%s\n' "$DEPLOY_REGISTRY_TOKEN" |
            ssh -i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              "bash /opt/beyondthearc/docker/deploy.sh '$SHA' ghcr.io '$DEPLOY_REGISTRY_USER'"
