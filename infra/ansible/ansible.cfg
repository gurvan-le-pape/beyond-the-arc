# Read through ANSIBLE_CONFIG (ansible.sh): Ansible ignores an ansible.cfg in the
# current directory when that directory is world-writable.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = /usr/bin/python3
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
forks = 2

[ssh_connection]
pipelining = True
