---
# The Compose host (CX23). Run with --check --diff unless the maintainer has said
# otherwise for that run. The volume role comes first, so Docker never starts without
# the volume.
- name: Configure the Compose host
  hosts: compose
  become: false
  roles:
    - volume
    - swap
    - journald
    - packages
    - unattended_upgrades
    - ssh_hardening
    - deploy_user
    - app
    - nginx
    - postgres_backup
