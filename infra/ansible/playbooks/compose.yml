---
# The Compose host (CX23). Run with --check --diff unless the maintainer has said
# otherwise for that run. The roles follow docker/provision/provision.sh section by
# section, in its order: the volume first, so Docker never starts without it.
- name: Configure the Compose host
  hosts: compose
  become: false
  roles:
    - volume
    - swap
    - journald
    - packages
    - unattended_upgrades
    - ssh_hardening
    - deploy_user
    - app
    - nginx
    - postgres_backup
