# Hosts by name only: each name is a Host entry in the maintainer's ~/.ssh/config,
# which holds the address. No address belongs in this repository.
all:
  children:
    compose:
      hosts:
        bta-prod-compose:
          # root until the cutover to the CX33; this host never gets an `ansible` user.
          ansible_user: root
    k3s:
      hosts:
        bta-prod-k3s:
          # Created by the automation_user role. The first run on a new host, before
          # it exists, connects as root: -e ansible_user=root (README.md). Root login is
          # off once that run is done (group_vars/k3s/main.yml).
          ansible_user: ansible
          ansible_become: true
