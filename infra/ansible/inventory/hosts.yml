# Hosts by name only: each name is a Host entry in the maintainer's ~/.ssh/config,
# which holds the address. No address belongs in this repository.
all:
  children:
    compose:
      hosts:
        bta-prod-compose:
          # root until the cutover to the CX33; this host never gets an `ansible` user.
          ansible_user: root
    k3s:
      hosts:
        bta-prod-k3s:
          # root until the `ansible` user exists on it.
          ansible_user: root
