# Password auth is unused here: root is key-only (PermitRootLogin without-password)
# and both root and deploy authenticate with keys. Left enabled it is a standing
# invitation -- any account later given a password becomes a remote login on an IP
# that grafana.beyondthearc.app resolves publicly. auth.log carries tens of
# thousands of failed password attempts and fail2ban is not running.
PasswordAuthentication no
KbdInteractiveAuthentication no
