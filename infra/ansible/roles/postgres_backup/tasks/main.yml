---
- name: Install age and rclone
  ansible.builtin.apt:
    name:
      - age
      - rclone
    state: present
    cache_valid_time: 3600

- name: Create the node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ postgres_backup_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/bta-db-backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the backup settings
  ansible.builtin.template:
    src: backup.env.j2
    dest: /etc/bta-db-backup/backup.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the backup script
  ansible.builtin.copy:
    src: bta-db-backup.sh
    dest: /usr/local/sbin/bta-db-backup
    owner: root
    group: root
    mode: "0755"

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bta-db-backup.service
    - bta-db-backup.timer
  notify: Reload systemd
  register: postgres_backup_units

- name: Apply systemd changes before enabling the timer
  ansible.builtin.meta: flush_handlers

# In --check the units are not written, so systemd cannot find the timer yet.
- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: bta-db-backup.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and postgres_backup_units.changed)
