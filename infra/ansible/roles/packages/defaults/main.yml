  - unattended-upgrades
# Per group: what that host runs on top of the base.
packages_extra: []
# Docker's apt repository, Docker Engine and the Compose plugin, and the service.
packages_docker: false
packages_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
# Nothing here uses them; snapd ran permanently with no snap installed.
packages_unwanted:
  - snapd
  - open-vm-tools
  - lxd-agent-loader
  - lxd-installer
  - docker-model-plugin
