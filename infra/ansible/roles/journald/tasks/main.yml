---
- name: Create journald's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap the journal's disk use
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ journald_system_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
