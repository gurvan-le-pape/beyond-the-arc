---
- name: Create the swap file
  ansible.builtin.shell:
    cmd: >-
      fallocate -l {{ swap_size }} {{ swap_file }} &&
      chmod 600 {{ swap_file }} &&
      mkswap {{ swap_file }}
    creates: "{{ swap_file }}"

- name: Keep the swap file private
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Add the swap file to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ swap_file }}\s'
    line: "{{ swap_file }} none swap sw 0 0"

- name: List the active swap
  ansible.builtin.command:
    argv: [swapon, --show=NAME, --noheadings]
  register: swap_active
  changed_when: false
  check_mode: false

- name: Turn the swap file on
  ansible.builtin.command:
    argv: [swapon, "{{ swap_file }}"]
  when: swap_file not in swap_active.stdout_lines
  changed_when: true

- name: Set swappiness
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-swappiness.conf
    content: |
      vm.swappiness={{ swap_swappiness }}
    owner: root
    group: root
    mode: "0644"
  notify: Apply swappiness
