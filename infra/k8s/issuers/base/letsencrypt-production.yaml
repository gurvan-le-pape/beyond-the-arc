# Let's Encrypt's production CA, for the certificates browsers and Cloudflare (SSL mode
# Full (strict)) trust: the rehearsal host's now, production's at the cutover. The same
# DNS-01 solver as the staging issuer, through the cluster's Cloudflare token. Its rate
# limits are real (50 certificates per registered domain per week, 5 duplicates of one
# name set per week): try a new name or setting on letsencrypt-staging first.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - beyondthearc.app
