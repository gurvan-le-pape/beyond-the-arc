# Let's Encrypt's staging CA: real ACME, certificates no browser trusts, and rate limits
# far above production's, for as many issuances as the lab needs. DNS-01: cert-manager
# proves control of the name with a TXT record it writes through Cloudflare's API, so the
# lab needs no public address and no inbound port. No e-mail: Let's Encrypt no longer
# sends expiry notices, and the account works without one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - beyondthearc.app
