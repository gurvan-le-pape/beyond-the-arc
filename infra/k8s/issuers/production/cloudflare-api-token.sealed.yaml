# The Cloudflare API token cert-manager answers DNS-01 challenges with on production's
# cluster: the lab's token (DNS edit on the beyondthearc.app zone only, expires
# 2027-02-25), sealed to bta-prod-k3s's key, so only the controller there can decrypt it,
# and only as the cloudflare-api-token Secret in cert-manager (strict scope). Sealed again
# as the lab's is (README, Certificates), with BTA_CLUSTER=production.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
