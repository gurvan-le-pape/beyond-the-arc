# The Cloudflare API token cert-manager answers DNS-01 challenges with: DNS edit on the
# beyondthearc.app zone only, nothing else in the account. Sealed to this cluster's Sealed
# Secrets key, so only the controller in this cluster can decrypt it, and only as the
# cloudflare-api-token Secret in cert-manager (strict scope). A new cluster has a new key;
# seal it again (README, Certificates).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
