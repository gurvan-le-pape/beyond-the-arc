# The Next.js server. A server render reaches the backend by its Service; the browser
# uses NEXT_PUBLIC_API_URL, which is inlined into the bundle when the image is built, so
# setting it here would change nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: beyond-the-arc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: beyond-the-arc
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node, which the image names but not by number
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Compose's wait on a healthy backend. Pods start together on a new cluster, and a
      # server render before the backend answers is an error card the ISR cache can keep.
      # The trade-off is compose's too: a backend that never gets healthy keeps the
      # frontend from starting. During a rolling update the old backend still serves.
      initContainers:
        - name: wait-for-backend
          image: ghcr.io/gurvan-le-pape/beyond-the-arc/frontend
          command:
            - sh
            - -c
            - until wget -q --spider http://backend:4000/api/health; do sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: frontend
          image: ghcr.io/gurvan-le-pape/beyond-the-arc/frontend
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app
          env:
            - name: INTERNAL_API_URL
              value: http://backend:4000/api
          # Readiness renders a page, as compose's healthcheck does: "listening, but every
          # render fails" is the failure it is for. /en and not /, which is only the
          # locale redirect.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /en
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The image optimiser's cache; ISR pages stay in memory (isrFlushToDisk off).
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: beyond-the-arc
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
