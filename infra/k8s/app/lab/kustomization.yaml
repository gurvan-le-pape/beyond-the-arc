# The application in the lab. The images are the ones CI built, started and pushed for a
# main commit, named by digest as the production deploy names them; moving the lab to
# another commit is changing these four digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bta
resources:
  - ../base
  - ingress.yaml
# A changed value renames the ConfigMap (a hash suffix), which rolls the pods that use it.
configMapGenerator:
  - name: app
    literals:
      - FRONTEND_URL=https://lab.beyondthearc.app
# main at 5b891df7.
images:
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/backend
    digest: sha256:4607421d084d36dc7f1180df13cf1b3df6a2b1568be227c18691f51c54d915eb
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/backend-migrate
    digest: sha256:8d63a170413eb247d17aaff04c8dbdba9473ccd8475fa54c761ccbcd8109960f
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/frontend
    digest: sha256:b17bb51d1064abc95590e0a3d429d281a059491fe8003a5ef4605c1397d4c72a
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/scheduler
    digest: sha256:2ae8f3ccbbaa6ddf7110e3e141c2e28b091ac2e0f5ae12a9772fec14e62f5261
