# The application on bta-prod-k3s (the CX33), for the phase 5 rehearsal: the images
# production's Compose stack runs on the CX23, by digest, so that the latency gate compares
# the same code on both hosts, against the database restored from its backup. Moving it to
# another commit is changing these four digests, with the CX23 on the same commit while
# the gate runs.
#
# FRONTEND_URL is the rehearsal hostname (the backend's only CORS origin); the Ingress for
# it comes with the certificates. SENTRY_ENVIRONMENT files the servers' errors as
# rehearsal, away from production's; the browser takes its environment from the hostname.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bta
resources:
  - ../base
  - backend-sentry.sealed.yaml
# A changed value renames the ConfigMap (a hash suffix), which rolls the pods that use it.
configMapGenerator:
  - name: app
    literals:
      - FRONTEND_URL=https://rehearsal.beyondthearc.app
      - SENTRY_ENVIRONMENT=rehearsal
      - SENTRY_RELEASE=2fe89b189b65cf4e1a95a1804b225109e6dcd2a8
# The backend reports to Sentry here, as it does on the CX23: its DSN, sealed to this
# cluster's key (backend-sentry.sealed.yaml).
patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: backend-sentry
              key: dsn
# main at 2fe89b18, deployed on the CX23 by run 46074468873.
images:
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/backend
    digest: sha256:05e3398bef85d8cecaf30fd430a7151424aeb50df0799e2bee597a7642f4b182
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/backend-migrate
    digest: sha256:d93020cce2fbd1e12f467355c27956ba6419595eeb488f492573f3676609f9ce
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/frontend
    digest: sha256:79c0a618dadda829fdb1e43d3d2c869f8d40f1d698e9c92929e6ceacb9ebd6d1
  - name: ghcr.io/gurvan-le-pape/beyond-the-arc/scheduler
    digest: sha256:25f3c2e279d09a9dd36cbd259627c2a4c377363c5567c01ae0b84a3517507fab
