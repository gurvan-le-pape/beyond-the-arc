# The backend's Sentry DSN on production's cluster, the one the CX23's .env holds. Sealed
# to this cluster's Sealed Secrets key, so only the controller in bta-prod-k3s can decrypt
# it, and only as the backend-sentry Secret in bta (strict scope). Sealed again from the
# CX23's .env, the value never on disk in clear:
#   ssh root@bta-prod-compose "sed -n 's/^SENTRY_DSN=//p' /opt/beyondthearc/.env" | tr -d '\n' |
#     BTA_CLUSTER=production ./k.sh sh -c 'kubectl create secret generic backend-sentry
#       --namespace bta --from-file=dsn=/dev/stdin --dry-run=client -o json | kubeseal --format yaml'
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backend-sentry
  namespace: bta
spec:
  encryptedData:
    dsn: 
  template:
    metadata:
      name: backend-sentry
      namespace: bta
