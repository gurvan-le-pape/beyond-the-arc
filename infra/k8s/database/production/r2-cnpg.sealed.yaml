# The R2 token production's database is backed up with (object-store.yaml): bta-k3s-cnpg,
# an Account API token with Object Read & Write on the bta-db-backups bucket only, no
# expiry. Sealed to this cluster's Sealed Secrets key, so only the controller in
# bta-prod-k3s can decrypt it, and only as the r2-cnpg Secret in bta (strict scope).
# Sealed again from the file the token's two values were written to, never on screen:
#   BTA_CLUSTER=production ./k.sh sh -c 'kubectl create secret generic r2-cnpg
#     --namespace bta --from-env-file=/dev/stdin --dry-run=client -o json |
#     kubeseal --format yaml' < ~/.config/bta-k8s/r2-cnpg-production.env
# where that file holds ACCESS_KEY_ID= and ACCESS_SECRET_KEY= lines.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: r2-cnpg
  namespace: bta
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ACCESS_SECRET_KEY: 
  template:
    metadata:
      name: r2-cnpg
      namespace: bta
