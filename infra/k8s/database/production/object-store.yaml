# Where production's database is backed up: the bta-db-backups bucket in R2 (EU
# jurisdiction), under cnpg/production/. The plugin writes base backups under
# database/base/ and WAL under database/wals/ there, the Cluster's name being its server
# name. Nothing under cnpg/ is locked, since Barman rewrites keys it has written
# (infra/terraform/cloudflare/r2.tf).
#
# Retention is a 14-day recovery window: any point in the last 14 days can be restored,
# and the plugin deletes what is older after each base backup, so about three weekly base
# backups are kept, 9 GB each uncompressed (scheduled-backup.yaml). The bucket has no
# lifecycle rule under cnpg/.
#
# The credentials are an R2 token with Object Read & Write on this bucket only
# (r2-cnpg.sealed.yaml): it must read, to restore and to apply the retention. The backups
# are encrypted at rest by R2 and not by age as the CX23's dumps are, since Barman cannot.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://bta-db-backups/cnpg/production/
    endpointURL: https://e093b1328feb8fef8d914c5e5351bc41.eu.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: r2-cnpg
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: r2-cnpg
        key: ACCESS_SECRET_KEY
    wal:
      compression: zstd
      maxParallel: 2
    # Base backups go uncompressed: R2 requires every part of a multipart upload but the
    # last to have the same length, and barman-cloud's compressed stream cuts parts of
    # varying length (InvalidPart, EnterpriseDB/barman#1161, unmerged). Measured on the
    # lab: 1 GB of poorly compressible data fails with zstd and passes without; a WAL
    # file is one part, so its compression is unaffected.
    data:
      jobs: 2
  # boto3's default integrity checksums are not R2's: the plugin's documented workaround
  # for S3-compatible stores (web/docs/object_stores.md, plugin v0.16.0).
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
