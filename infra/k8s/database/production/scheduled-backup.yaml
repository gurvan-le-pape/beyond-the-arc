# A base backup every Monday at 03:00 UTC (04:00 in Paris in winter, 05:00 in summer: the
# schedule has no time zone), the first night after the weekend's matches. Weekly, not
# nightly: base backups are uncompressed (object-store.yaml), 9 GB each, and the WAL in
# between is small, so a restore replays little of it. Any point in between is restored
# from the WAL. immediate takes one as soon as this is created.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: weekly
spec:
  # Seconds first: six fields; the last is the day of the week, 1 for Monday.
  schedule: "0 0 3 * * 1"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: database
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
