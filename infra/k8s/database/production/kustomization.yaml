# Production's database (bta-prod-k3s, the CX33): the base Cluster, with its WAL archived
# and a base backup taken nightly to R2 by the Barman Cloud Plugin (../../apps/templates/
# barman-cloud.yaml). The bucket, and why cnpg/ has no lock, are in
# infra/terraform/cloudflare/r2.tf.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bta
resources:
  - ../base
  - r2-cnpg.sealed.yaml
  - object-store.yaml
  - scheduled-backup.yaml
  - pod-monitor.yaml
# Turning archiving on restarts the instance once, to add the plugin's sidecar.
patches:
  - target:
      kind: Cluster
      name: database
    patch: |-
      - op: add
        path: /spec/plugins
        value:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: r2
