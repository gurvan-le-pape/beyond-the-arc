# Values for the argo-cd Helm chart, read by bootstrap.sh for the first install and by the
# `argocd` Application (../apps/templates/argocd.yaml) for every sync after it: Argo CD
# manages itself from this file.
#
# The lab runs one replica of each component and only what the app of apps uses: no Dex
# (the admin account is the only login), no notifications, no ApplicationSet controller.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  cm:
    # observability/ reads production's configuration files under docker/config/, outside
    # its own directory, which Kustomize refuses by default. Every path stays inside this
    # repository, which Argo CD checks out whole.
    kustomize.buildOptions: --load-restrictor LoadRestrictionsNone
  # ARC's charts are published only as OCI artifacts, which Argo CD reads from a
  # repository declared as such. Public: no credentials.
  repositories:
    arc-charts:
      name: arc
      type: helm
      url: ghcr.io/actions/actions-runner-controller-charts
      enableOCI: "true"
