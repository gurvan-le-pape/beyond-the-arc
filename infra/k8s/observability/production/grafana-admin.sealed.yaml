# Grafana's admin password on production's cluster. The plain value is on the maintainer's
# machine only, in ~/.config/bta-k8s/grafana-admin-production.env
# (GRAFANA_ADMIN_PASSWORD=…, mode 600), generated at random; here it is sealed to
# bta-prod-k3s's key, as the grafana-admin Secret in monitoring. Sealed again like the
# lab's (README, Observability), with BTA_CLUSTER=production and that file.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
