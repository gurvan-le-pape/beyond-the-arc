# Grafana's admin password. The plain value is on the maintainer's machine only, in
# ~/.config/bta-k8s/grafana-admin.env (GRAFANA_ADMIN_PASSWORD=…, mode 600), generated at
# random; here it is sealed to this cluster, as the grafana-admin Secret in monitoring.
# A new cluster has a new key; seal it again (README, Certificates).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
