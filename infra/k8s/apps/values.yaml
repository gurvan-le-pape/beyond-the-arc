# The repository and revision every Application reads from. root.yaml leaves them at
# these defaults; bootstrap.sh overrides targetRevision to try a branch.
repoURL: https://github.com/gurvan-le-pape/beyond-the-arc.git
targetRevision: main

# The argo-cd chart, the version bootstrap.sh installs first and the argocd Application
# keeps. Its appVersion is the Argo CD release, which ../Dockerfile's CLI matches.
argocd:
  chartVersion: 10.20.0

# The CloudNativePG operator chart; its appVersion is the operator release.
cnpg:
  chartVersion: 0.29.2

# cert-manager, which issues the lab's certificates by DNS-01 against Cloudflare.
certManager:
  chartVersion: v1.21.3

# The Sealed Secrets controller; ../Dockerfile's kubeseal is the same release.
sealedSecrets:
  chartVersion: 2.22.0
