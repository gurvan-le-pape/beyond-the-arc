# The cluster this chart renders for, lab or production: it names the cluster's own
# overlay where one component differs between them (app/<cluster>).
cluster: lab

# The components this cluster runs, one per Application (argocd always runs). These
# defaults are the lab's, which runs everything; values-production.yaml switches off
# what production does not run yet. root.yaml reads that file on production only
# (bootstrap.sh, BTA_CLUSTER).
components:
  sealedSecrets: true
  cnpg: true
  database: true
  app: true
  certManager: true
  issuers: true
  kubePrometheusStack: true
  observability: true
  arc: true

# The repository and revision every Application reads from. root.yaml leaves them at
# these defaults; bootstrap.sh overrides targetRevision to try a branch.
repoURL: https://github.com/gurvan-le-pape/beyond-the-arc.git
targetRevision: main

# The argo-cd chart, the version bootstrap.sh installs first and the argocd Application
# keeps. Its appVersion is the Argo CD release, which ../Dockerfile's CLI matches.
argocd:
  chartVersion: 10.20.0

# The CloudNativePG operator chart; its appVersion is the operator release.
cnpg:
  chartVersion: 0.29.2

# cert-manager, which issues the lab's certificates by DNS-01 against Cloudflare.
certManager:
  chartVersion: v1.21.3

# The Sealed Secrets controller; ../Dockerfile's kubeseal is the same release.
sealedSecrets:
  chartVersion: 2.22.0

# Prometheus, its operator, node-exporter and kube-state-metrics.
kubePrometheusStack:
  chartVersion: 94.2.0

# Actions Runner Controller: the controller chart and the runner scale set chart, one
# release.
arc:
  chartVersion: 0.15.1
