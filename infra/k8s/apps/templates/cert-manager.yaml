# cert-manager, with its CRDs. Its issuers live in ../../issuers/<cluster>.
{{- if .Values.components.certManager }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: {{ .Values.certManager.chartVersion }}
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        # A post-install Job that waits for the webhook; Argo CD's health checks already
        # wait for the Deployments.
        startupapicheck:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
