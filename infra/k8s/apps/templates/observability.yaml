# Grafana, Loki, the blackbox exporter, Alloy and the scrape targets (../../observability/<cluster>).
{{- if .Values.components.observability }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: infra/k8s/observability/{{ .Values.cluster }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # On a new cluster this syncs alongside kube-prometheus-stack, before the
      # ServiceMonitor and Probe CRDs exist; the retry below waits for them.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
