# The Sealed Secrets controller. kubeseal looks for it as sealed-secrets-controller in
# kube-system, so it runs under that name there.
{{- if .Values.components.sealedSecrets }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: {{ .Values.sealedSecrets.chartVersion }}
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # No new key every 30 days: each one would have to be backed up again
        # (../../sealed-secrets-key.sh) before anything is sealed to it. Rotation is by
        # hand, followed by a backup.
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
