# The bta-arc-lab GitHub App's credentials, which the runner scale set registers and
# authenticates with: its id, its installation id on this repository, and its private
# key. The App holds Administration write on this repository only (the narrowest
# permission GitHub has for repository runners) and no webhook. Sealed to this cluster,
# as the arc-github-app Secret in arc-runners; the plain files are on the maintainer's
# machine (~/.config/bta-k8s/arc-app.env and arc-app.pem, mode 600). A new cluster has a
# new key; seal them again (README, Runners).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  encryptedData:
    github_app_id: 
    github_app_installation_id: 
    github_app_private_key: 
  template:
    metadata:
      name: arc-github-app
      namespace: arc-runners
